name: Shaker
options:
  bundleIdPrefix: com.purchasely
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  Purchasely:
    # Purchasely-iOS-Sources/develop has no Package.swift at the repository root,
    # so Shaker uses a tiny local Swift package that symlinks to ../iOS/Purchasely.
    path: LocalPackages/Purchasely

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Shaker:
    type: application
    platform: iOS
    sources:
      - path: Shaker
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Shaker/Resources/cocktails.json
      - path: Shaker/Resources/images
      - path: Shaker/Assets.xcassets
    dependencies:
      - package: Purchasely
    settings:
      base:
        INFOPLIST_FILE: Shaker/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.purchasely.shaker
        CODE_SIGN_STYLE: Automatic
        PURCHASELY_API_KEY: $(PURCHASELY_API_KEY)
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    scheme:
      testTargets:
        - ShakerTests
      gatherCoverageData: true
  ShakerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShakerTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Shaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.purchasely.shaker.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # XCTestCase is non-Sendable and predates async/await, so Swift 6 complete
        # strict concurrency flags every `try await super.setUp()`. Keep production
        # code on `complete` and relax tests to `minimal`.
        SWIFT_STRICT_CONCURRENCY: minimal
