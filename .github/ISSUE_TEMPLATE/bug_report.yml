name: Bug report
description: Report a problem with the Shaker sample app
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.
        For issues with the Purchasely SDK itself, please open the issue on the dedicated SDK repo instead.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: Purchasely SDK version
      placeholder: e.g. 5.7.5
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS / device
      placeholder: e.g. iOS 17.4 on iPhone 15 Pro, Android 14 on Pixel 8
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
